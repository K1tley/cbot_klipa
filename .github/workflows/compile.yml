name: Daily compilation (long video)

on:
  schedule:
    # 04:37 in Prague = 03:37 UTC in winter, 02:37 UTC in summer. The script only works at
    # compilation.hour from config.yaml, so both lines are needed.
    - cron: "37 2 * * *"
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build it right now (ignore the clock)"
        type: boolean
        default: true

concurrency:
  group: clipbot
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Build compilation
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m clipbot compile ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
