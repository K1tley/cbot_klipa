name: Hourly post (Google Drive -> YouTube)

on:
  schedule:
    # every hour at :17, except Prague quiet hours (02:00-07:00) to save GitHub minutes.
    # UTC hours 0,5-23 cover 07:00-01:59 Prague in both winter and summer time.
    - cron: "17 0,5-23 * * *"
  workflow_dispatch:

concurrency:
  group: clipbot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python packages
        run: pip install requests pyyaml tzdata google-api-python-client google-auth anthropic
      - name: Post due clips
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m clipbot post
