name: GTA channel (English compilations)

on:
  # Automatic runs are OFF until the GTA YouTube token (YOUTUBE_REFRESH_TOKEN_GTA) is set - without it the videos
  # only piled up on Google Drive and filled it. To turn back on, uncomment:
  # schedule:
  #   - cron: "23 5,13,21 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "What to make"
        type: choice
        options: [all, groups, best]
        default: all
      group:
        description: "Only this group (e.g. CORE) - empty = all groups"
        type: string
        default: ""
      force:
        description: "Make it now even if it ran recently"
        type: boolean
        default: true

concurrency:
  group: clipbot-gta
  cancel-in-progress: false

jobs:
  gta:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Build and upload GTA compilations
        env:
          CLIPBOT_CONFIG: config_gta.yaml
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_GTA }}   # token of the GTA channel
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          python -m clipbot gta ${{ github.event_name == 'workflow_dispatch' && inputs.job || 'all' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.group != '') && format('--group "{0}"', inputs.group) || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
