name: Daily fetch (clips -> Google Drive)

on:
  schedule:
    # GitHub cron is in UTC. 04:00 in Prague is 03:00 UTC in winter and
    # 02:00 UTC in summer, so both run and the script only works at the
    # local hour set in config.yaml (fetch_hour). If you change fetch_hour,
    # change these two hours too: (fetch_hour - 1) and (fetch_hour - 2), in UTC.
    - cron: "7 2 * * *"
    - cron: "7 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch right now (ignore the clock)"
        type: boolean
        default: true

concurrency:
  group: clipbot      # never run fetch and post at the same time
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Fetch clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m clipbot fetch ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
