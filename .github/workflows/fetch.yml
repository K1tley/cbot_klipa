name: Daily fetch (clips -> Google Drive)

on:
  schedule:
    - cron: "7 22 * * *"
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch right now (ignore the clock)"
        type: boolean
        default: true

concurrency:
  group: clipbot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Fetch clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m clipbot fetch ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
