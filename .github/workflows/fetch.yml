name: Daily fetch (clips -> Google Drive)

on:
  schedule:
    # GitHub cron is UTC and GitHub often starts scheduled runs late (sometimes hours), so there are
    # several tries. The first one that runs at/after fetch_hour (config.yaml) does the work; the others
    # see that today's fetch is done and stop within seconds.
    # 02:07 / 03:07 UTC = 04:07 Prague in summer / winter, then backups at about 06, 09 and 12 Prague time.
    - cron: "7 2 * * *"
    - cron: "7 3 * * *"
    - cron: "7 5 * * *"
    - cron: "7 8 * * *"
    - cron: "7 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch right now (ignore the clock)"
        type: boolean
        default: true

concurrency:
  group: clipbot      # never run fetch and post at the same time
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Fetch clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m clipbot fetch ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
