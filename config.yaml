    platform: twitch
    channel: agraelus
  - name: Herdyn
    platform: twitch
    channel: herdyn
  - name: CzechCloud
    platform: kick
    channel: czechcloud
  - name: FattyPillow
    platform: kick
    channel: fattypillow
  - name: Restt
    platform: kick
    channel: restt
  - name: HaiseT
    platform: kick          # moved from Twitch to Kick in 2026
    channel: haiset
  - name: Flygun
    platform: kick          # moved from Twitch to Kick in 2026
    channel: flygun

# ------------------------------------------------------------
#  Daily long compilation (horizontal YouTube video)
# ------------------------------------------------------------
compilation:
  enabled: true
  hour: 4                  # built at 04:xx (after the Shorts fetch). Change compile.yml cron too.
  upload: immediately      # immediately = upload right after rendering (~05:00) | at_upload_hour
  upload_hour: 17          # only used with "upload: at_upload_hour"
  publish_hour: 18         # with youtube.schedule_publish: YouTube publishes the compilation at this hour
  privacy: private         # uploaded as private, so you can check it and publish it yourself
  first_episode: 1         # title ends with "| Klipy dne #N"; N counts up with every uploaded compilation
  min_minutes: 10          # preferred length 10-25 min: on a thin day the bar is lowered to reach 10 min ...
  max_minutes: 25
  absolute_min_minutes: 5  # ... but if even then there's less than this, no video that day
  score_threshold: 2.0     # "popular" = at least 2x the views that streamer's clips normally get
  min_views: 5             # ignore clips with fewer views than this, whatever the score
  min_baseline: 10         # floor for a channel's usual views, so a tiny channel's 37 views isn't "18x normal"
  clips_per_channel: 10    # look at each channel's top N clips of the day
  max_clips_per_streamer: 4
  max_clips_per_small_streamer: 1   # channels under popularity.reference_viewers (not your Shorts creators)
  max_average_seconds: 40  # average clip length in the video stays at or below this
  name_tag: true           # streamer name in the bottom-left corner ...
  name_tag_seconds: 5      # ... for the first N seconds of each clip (0 = whole clip)
  crf: 23                  # video quality (lower = better/bigger). 23 = ~0.7 GB for 20 min
  logo:                    # used in the TV-static transitions and on the thumbnail
    image: logo.png
    corner: false          # true = also a small logo in the top-right corner during the clips
    width: 160             # (size/opacity of that corner logo)
    opacity: 0.9
  thumbnail:               # collage of the strongest clips (one per streamer)
    panels: 3              # how many clips/streamers in the collage
    ai_frame_pick: true    # Claude picks the most eye-catching frame of each clip (a few cents a day)
    names: true            # streamer names at the bottom
    episode_badge: true    # "#12" in the top-left corner
    badge_color: [229, 37, 33]
    text_color: [255, 222, 0]
    text_size: 132
    logo_size: 230
    saturation: 1.35
    contrast: 1.15
  teaser:                  # start of the video: "V dnešním videu uvidíte" + quick cuts from the best clips
    enabled: false         # turned off: the quick cuts didn't show anything meaningful
    clips: 4
    seconds: 2.5           # length of each cut
    text: "V dnešním videu uvidíte"
  fade_out_seconds: 1.5    # fade to black at the very end of the video (0 = off)
  transition:              # short TV static between clips, with the logo in the middle
    enabled: true
    seconds: 0.6
    logo: true
    logo_width: 460
    volume: 0.12           # loudness of the static noise (0.0 - 1.0)
  popularity:              # prefer well-known streamers: score is multiplied by a channel-size weight
    weight: 1.0            # 0 = ignore channel size, 1 = strongly prefer big channels
    reference_viewers: 500 # a channel with this many live viewers gets weight 1.0
    min_factor: 0.15       # smallest weight (tiny channels)
    max_factor: 1.5        # biggest weight
    favorite_viewers: 2000 # the Shorts creators above always count as at least this big
  discover:                # finds CZ/SK Twitch channels automatically from live streams
    languages: [cs, sk]
    every_hours: 2
    min_viewers: 300       # only use channels that had at least this many live viewers (Shorts creators always count)
    min_times_seen: 3      # ... and were seen streaming in CZ/SK at least this many times (filters one-off foreign streams)
    active_days: 14        # forget channels not seen live for this long
    max_channels: 150      # scan at most this many (biggest first)
  # Channels that must never be used (e.g. foreign streamers with Czech set as their language):
  blocked_channels: [terry_talk]     # e.g. [somechannel, otherchannel]
  # Kick can't be searched by language - add Kick (or extra Twitch) channels here by hand.
  # The creators from the Shorts list above are always included automatically.
  extra_channels:          # well-known CZ/SK streamers used in the compilation (not in the Shorts)
    - {name: Kapesník, platform: kick, channel: kapesnik69}
    - {name: Xnapy, platform: twitch, channel: xnapycz}
    - {name: Freeze, platform: twitch, channel: freezecz}
    - {name: Claina, platform: twitch, channel: claina}
