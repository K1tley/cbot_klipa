# ============================================================
#  ClipBot configuration — edit this file to change behaviour
# ============================================================

timezone: Europe/Prague

# Daily fetch: the local hour (0-23) when clips are collected.
# 4 = 04:00. If you change this, ALSO change the cron lines in
# .github/workflows/fetch.yml (see the comment there).
fetch_hour: 4

clips_per_creator: 3      # take up to this many top clips per creator
lookback_hours: 24        # "recent" = clips created in the last N hours
retention_days: 3         # Drive folders older than this are deleted
drive_root_folder: ClipBot

posting:
  # No posts during these local hours: [from, to). [2, 7] = nothing between 02:00 and 07:00.
  quiet_hours: [2, 7]
  # Posts start at start_hour and are spread evenly until the quiet hours begin
  # (07:00 -> 02:00 = 19 hours), never closer together than min_interval_minutes.
  # With 30 min that's up to 38 clips a day:
  #   38 clips -> every 30 min | 19 clips -> every 60 min | 14 clips -> ~every 80 min | 5 clips -> ~every 4 h
  start_hour: 7
  min_interval_minutes: 30
  max_per_run: 2          # safety cap if a scheduled run was skipped

youtube:
  privacy: private        # public | unlisted | private
  category_id: "20"       # 20 = Gaming
  vertical: true          # convert 16:9 clips to 9:16 (blurred background) so they count as Shorts
  background_saturation: 1.2  # colour of the blurred background: 1.0 = unchanged, 1.2 = +20 %
  max_seconds: 179        # Shorts limit is 3 minutes

# Logo / image placed on every video. Remove the "image" line (or the whole block) to turn it off.
overlay:
  image: logo.png         # file in the main folder of the repo (PNG with transparent background)
  position: top-band      # top-band / bottom-band = centred in the blurred area above / below the clip
                          # or: top-left, top-right, bottom-left, bottom-right, center
  width: 340              # size in pixels (the video is 1080 wide)
  opacity: 1.0            # 0.0 - 1.0

captions:
  language: Czech         # language of the YouTube title/description
  model: claude-sonnet-5-5 # Anthropic model used for captions + hashtags

# ------------------------------------------------------------
#  Creators to follow.
#  platform: twitch | kick
#  channel:  the login/slug from the URL (twitch.tv/<channel>, kick.com/<channel>)
# ------------------------------------------------------------
creators:
  - name: Agraelus
    platform: twitch
    channel: agraelus
  - name: Herdyn
    platform: twitch
    channel: herdyn
  - name: CzechCloud
    platform: kick
    channel: czechcloud
  - name: FattyPillow
    platform: kick
    channel: fattypillow
  - name: Restt
    platform: kick
    channel: restt

# ------------------------------------------------------------
#  Daily long compilation (horizontal YouTube video)
# ------------------------------------------------------------
compilation:
  enabled: true
  hour: 4                  # built at 04:xx (after the Shorts fetch). Change compile.yml cron too.
  upload_hour: 17          # uploaded at 17:00 ...
  privacy: private         # ... as private, so you can check it and publish it yourself
  first_episode: 1         # title ends with "| Klipy dne #N"; N counts up with every uploaded compilation
  min_minutes: 5           # shorter than this (on a thin day) -> no video that day
  max_minutes: 20
  score_threshold: 2.0     # "popular" = at least 2x the views that streamer's clips normally get
  min_views: 30            # ignore clips with fewer views than this, whatever the score
  min_baseline: 10         # floor for a tiny channel's average, so 12 views isn't "5x normal"
  clips_per_channel: 10    # look at each channel's top N clips of the day
  max_clips_per_streamer: 4
  max_clip_seconds: 60     # longer clips are cut at this length
  name_tag: true           # streamer name in the bottom-left corner ...
  name_tag_seconds: 5      # ... for the first N seconds of each clip (0 = whole clip)
  crf: 23                  # video quality (lower = better/bigger). 23 = ~0.7 GB for 20 min
  logo:
    image: logo.png
    width: 160
    opacity: 0.9
  discover:                # finds CZ/SK Twitch channels automatically from live streams
    languages: [cs, sk]
    every_hours: 2
    min_viewers: 20        # only remember channels with at least this many live viewers
    active_days: 14        # forget channels not seen live for this long
    max_channels: 150      # scan at most this many (biggest first)
  # Kick can't be searched by language - add Kick (or extra Twitch) channels here by hand.
  # The creators from the Shorts list above are always included automatically.
  extra_channels:
    # - name: SomeStreamer
    #   platform: kick
    #   channel: somestreamer
